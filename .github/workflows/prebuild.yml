name: Prebuild
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release to prebuild, or none to only build the prebuilds
        required: false
permissions:
  contents: read
jobs:
  prebuild:
    strategy:
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15
            platform: ios
            arch: arm64
          - os: macos-15
            platform: ios
            arch: arm64
            tags: -simulator
            flags: --simulator
          - os: macos-15
            platform: ios
            arch: x64
            tags: -simulator
            flags: --simulator
    runs-on: ${{ matrix.os }}
    name: Build / ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          flags: ${{ matrix.flags }} -D BARE_KIT_SWIFT_ENGINE=v8
          build: build/v8
          prefix: prebuilds/v8
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          flags: ${{ matrix.flags }} -D BARE_KIT_SWIFT_ENGINE=javascriptcore
          build: build/javascriptcore
          prefix: prebuilds/javascriptcore
      - uses: holepunchto/actions/upload-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          tags: ${{ matrix.tags }}
          archive: true
  release:
    runs-on: macos-latest
    if: ${{ inputs.tag }}
    environment:
      name: github
    permissions:
      id-token: write
      attestations: write
      contents: write
    needs: prebuild
    name: Release
    steps:
      - uses: holepunchto/actions/checkout@v1
      - uses: holepunchto/actions/download-prebuilds@v1
        with:
          archive: true
      - id: v8
        uses: holepunchto/actions/create-xcframework@v1
        with:
          name: BareKit
          prefix: prebuilds/v8
          archive: true
          attest: true
      - id: javascriptcore
        uses: holepunchto/actions/create-xcframework@v1
        with:
          name: BareKit
          prefix: prebuilds/javascriptcore
          path: BareKit.JavaScriptCore.xcframework
          archive: true
          attest: true
      - uses: holepunchto/actions/create-github-release@v1
        with:
          draft: true
          tag: ${{ inputs.tag }}
          files: >
            ${{ steps.v8.outputs.path }}
            ${{ steps.javascriptcore.outputs.path }}
