name: Integrate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    name: Security
    steps:
      - uses: holepunchto/actions/security-base@v1
  lint:
    runs-on: macos-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/swift-base@v1
      - run: swift format lint --recursive --strict .
  test:
    strategy:
      matrix:
        platform: [darwin]
        arch: [x64, arm64]
        engine: [v8, javascriptcore]
        include:
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.platform }}-${{ matrix.arch }} / ${{ matrix.engine }}
    steps:
      - uses: holepunchto/actions/swift-base@v1
      - uses: holepunchto/actions/setup-node@v1
      - uses: holepunchto/actions/install-npm-dependencies@v1
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          flags: -D BARE_KIT_SWIFT_ENGINE=${{ matrix.engine }}
      - uses: holepunchto/actions/create-xcframework@v1
        with:
          name: BareKit
      - run: swift test
        env:
          BARE_KIT_LOCAL: 1
